name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Build Debug APK with Gradle
        env:
          SKIP_SIGNING: "true"
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Direct Download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoiceShield-ShizuProbe.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceShield-ShizuProbe-APK
          path: dist/VoiceShield-ShizuProbe.apk

      - name: Create or Update Direct Phone Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "VoiceShield ShizuCall Interceptor APK"
          body: |
            ### 📱 Direct APK Download for Android Phone
            Download `VoiceShield-ShizuProbe.apk` directly on your phone and install.
          files: dist/VoiceShield-ShizuProbe.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
